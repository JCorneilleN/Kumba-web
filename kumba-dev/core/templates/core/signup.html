{% extends "core/base.html" %}
{% load static %}
{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="text-center p-4 shadow rounded" style="max-width: 500px; width:100%;">
    <img src="{% static 'core/logo.png' %}" alt="Kumba Logo" class="mb-4" style="max-width: 120px;">
    <h4 class="mb-3">Create a new account</h4>
    <form method="post">
      {% csrf_token %}
      <div class="mb-2"><input name="first_name" class="form-control" placeholder="First Name" required></div>
      <div class="mb-2"><input name="last_name" class="form-control" placeholder="Last Name" required></div>
      <div class="mb-2">
        <select name="gender" class="form-select" required>
          <option value="">Gender</option>
          <option>Female</option>
          <option>Male</option>
          <option>Other</option>
        </select>
      </div>
      <div class="mb-3">
        <input list="collegeList" name="school" class="form-control" placeholder="School / University" required>
        <datalist id="collegeList">
          {% for college in colleges %}
            <option value="{{ college }}">
          {% endfor %}
        </datalist>
      </div>
      <div class="mb-2"><input name="dob" type="date" class="form-control" required></div>
      <div class="mb-2"><input name="email" type="email" class="form-control" placeholder="Email (.edu)" required></div>
      <div class="mb-3"><input name="password" type="password" class="form-control" placeholder="Password" required></div>
      <button class="btn btn-primary w-100">Sign Up</button>
    </form>
    <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
