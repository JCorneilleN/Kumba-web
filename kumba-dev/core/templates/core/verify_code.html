{% extends "core/base.html" %}
{% block content %}
<div class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">
  <h4 class="text-center mb-3">Email Verification</h4>
  <form method="post">
    {% csrf_token %}
    <input name="code" class="form-control mb-3" placeholder="Enter the 6-digit code" required>
    <button class="btn btn-success w-100">Verify</button>
  </form>
</div>
{% endblock %}
