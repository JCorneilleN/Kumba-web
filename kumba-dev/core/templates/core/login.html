{% extends "core/base.html" %}
{% load static %}
{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="text-center p-4 shadow rounded" style="max-width: 400px; width: 100%;">
    <img src="{% static 'core/logo.png' %}" alt="Kumba Logo" class="mb-4" style="max-width: 150px;">
    <h4 class="mb-3">Login to Kumba</h4>

    <form method="post">
      {% csrf_token %}
      <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
      <input name="password" type="password" class="form-control mb-3" placeholder="Password" required>
      <button class="btn btn-primary w-100">Login</button>
    </form>

    <p class="mt-3">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
  </div>
</div>
{% endblock %}
