{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="p-4 shadow rounded text-center" style="max-width:400px; width:100%;">
    <h4 class="mb-3">Your Profile</h4>
    {% if user.profile_picture %}
      <img src="{{ user.profile_picture }}" class="rounded-circle mb-3" style="width:120px; height:120px;">
    {% else %}
      <div class="bg-secondary rounded-circle mb-3" style="width:120px; height:120px;"></div>
    {% endif %}
    <p><strong>{{ user.first_name }} {{ user.last_name }}</strong></p>
    <p>{{ user.gender }}, {{ user.school }}, Age {{ (today.year|add:-user.dob|date:"Y") }}</p>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Change Profile Picture</label>
        <input type="file" name="profile_picture" class="form-control" accept="image/*" required>
      </div>
      <button class="btn btn-primary w-100">Upload</button>
    </form>
  </div>
</div>
{% endblock %}
