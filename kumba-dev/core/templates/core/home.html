{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="container text-center py-5">
  <h1 class="mb-4">Welcome to Kumba</h1>
  <a href="{% url 'list_rides' %}" class="btn btn-warning btn-lg mx-2">Request a ride</a>
  <a href="{% url 'post_ride' %}"   class="btn btn-danger  btn-lg mx-2">Post a ride</a>

  <div id="carouselExampleIndicators" class="carousel slide mt-5" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
      <button data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
      <button data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="{% static 'core/images/slide1.jpg' %}" class="d-block w-100" alt="Slide 1">
      </div>
      <div class="carousel-item">
        <img src="{% static 'core/images/slide2.jpg' %}" class="d-block w-100" alt="Slide 2">
      </div>
      <div class="carousel-item">
        <img src="{% static 'core/images/slide3.jpg' %}" class="d-block w-100" alt="Slide 3">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</div>
{% endblock %}
