{% load static %}
{% extends "core/base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="text-center p-4 shadow rounded" style="max-width: 600px; width:100%;">
    <img src="{% static 'core/logo.png' %}" alt="Kumba Logo" class="mb-4" style="max-width: 120px;">
    <h3 class="mb-3">Welcome, {{ name }}!</h3>
    <p><strong>Email:</strong> {{ email }}</p>
    <p><strong>Date of Birth:</strong> {{ dob }}</p>

    <div class="my-3 d-flex justify-content-center gap-2">
      <form method="post" action="{% url 'reset_password' %}">
        {% csrf_token %}
        <button class="btn btn-warning">Reset Password</button>
      </form>
      <a href="{% url 'logout' %}" class="btn btn-danger">Log Out</a>
    </div>

    <hr class="my-4">

    <h5>Your Location Map</h5>
    <div class="map-container my-3">
      <iframe 
        src="https://www.openstreetmap.org/export/embed.html?bbox=-0.09%2C51.505%2C-0.08%2C51.51&amp;layer=mapnik"
        allowfullscreen 
        loading="lazy">
      </iframe>
    </div>
  </div>
</div>
{% endblock %}
