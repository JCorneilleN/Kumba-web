{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="d-flex flex-column justify-content-center align-items-center vh-100">
  <form method="post" enctype="multipart/form-data" class="text-center">
    {% csrf_token %}
    {% if profile_picture %}
      <label for="profile_picture">
        <img src="{{ profile_picture }}"
             class="rounded-circle mb-3"
             style="width:150px; height:150px; object-fit:cover; cursor:pointer;"
             title="Click to change picture">
      </label>
    {% else %}
      <label for="profile_picture">
        <div class="bg-secondary rounded-circle mb-3"
             style="width:150px; height:150px; cursor:pointer;"></div>
      </label>
    {% endif %}
    <input id="profile_picture" name="profile_picture" type="file"
           accept="image/*" hidden onchange="this.form.submit()">
  </form>

  <h3>Welcome, {{ name }}!</h3>
  <p>Email: {{ email }}<br>Born: {{ dob }}</p>
  <a href="{% url 'reset_password' %}" class="btn btn-link">Reset Password</a>
  <a href="{% url 'logout' %}" class="btn btn-link">Log Out</a>
</div>

    <hr class="my-4">

    <h5>Your Location Map</h5>
    <div class="map-container my-3">
      <iframe 
        src="https://www.openstreetmap.org/export/embed.html?bbox=-0.09%2C51.505%2C-0.08%2C51.51&amp;layer=mapnik"
        allowfullscreen 
        loading="lazy">
      </iframe>
    </div>
  </div>
</div>
{% endblock %}
