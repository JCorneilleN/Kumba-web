{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="p-4 shadow rounded" style="max-width: 500px; width:100%;">
    <h4 class="text-center mb-3">Post a New Ride</h4>
    <form method="post">
      {% csrf_token %}
      <div class="mb-2"><input name="origin" class="form-control" placeholder="Origin" required></div>
      <div class="mb-2"><input name="destination" class="form-control" placeholder="Destination" required></div>
      <div class="mb-2"><input type="date" name="date" class="form-control" required></div>
      <div class="mb-2"><input type="time" name="time" class="form-control" required></div>
      <div class="mb-2"><input type="number" name="seats" class="form-control" min="1" placeholder="Seats available" required></div>
      <div class="mb-3"><textarea name="notes" class="form-control" placeholder="Additional notes (optional)"></textarea></div>
      <button class="btn btn-primary w-100">Post Ride</button>
    </form>
  </div>
</div>
{% endblock %}
