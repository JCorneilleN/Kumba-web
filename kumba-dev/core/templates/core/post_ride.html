{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="container my-4">
  <h3 class="mb-4">Post a Ride</h3>
  <form method="post">
    {% csrf_token %}

    <div class="mb-3 position-relative">
      <label for="origin" class="form-label">Origin</label>
      <input 
        type="text" 
        id="origin" 
        name="origin" 
        class="form-control" 
        placeholder="Start typing an address…" 
        autocomplete="off" 
        required>
      <div id="origin-suggestions" 
           class="list-group position-absolute w-100" 
           style="z-index:1000;"></div>
    </div>

    <div class="mb-3 position-relative">
      <label for="destination" class="form-label">Destination</label>
      <input 
        type="text" 
        id="destination" 
        name="destination" 
        class="form-control" 
        placeholder="Start typing an address…" 
        autocomplete="off" 
        required>
      <div id="destination-suggestions" 
           class="list-group position-absolute w-100" 
           style="z-index:1000;"></div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" id="date" name="date" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label for="time" class="form-label">Time</label>
        <input type="time" id="time" name="time" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label for="seats" class="form-label">Seats</label>
        <input type="number" id="seats" name="seats" class="form-control" min="1" required>
      </div>
      <div class="mb-3">
        <label for="price" class="form-label">Price Per Person ($)</label>
        <input type="number" step="0.01" id="price" name="price"
               class="form-control" placeholder="e.g. 12.50" required>
      </div>
    </div>

    <div class="mb-3">
      <label for="car_type" class="form-label">Car Make/Model</label>
      <input type="text" id="car_type" name="car_type" class="form-control" placeholder="e.g. Toyota Camry">
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="car_year" class="form-label">Year</label>
        <input type="text" id="car_year" name="car_year" class="form-control" placeholder="e.g. 2020">
      </div>
      <div class="col-md-6 mb-3">
        <label for="car_color" class="form-label">Color</label>
        <input type="text" id="car_color" name="car_color" class="form-control" placeholder="e.g. Silver">
      </div>
    </div>

    <div class="mb-3">
      <label for="notes" class="form-label">Additional Notes</label>
      <textarea id="notes" name="notes" class="form-control" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Post Ride</button>
  </form>
</div>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'core/js/autocomplete.js' %}"></script>
{% endblock %}
